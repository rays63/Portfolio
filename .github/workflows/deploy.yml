name: Deploy

# The admin editor commits app/content.json to this branch, so every content
# save lands here and triggers a rebuild. Pushes from normal development
# deploy the same way.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A burst of content saves should end with one deploy of the latest commit,
  # not a queue of stale ones.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `npm run deploy` would rebuild; the build already ran above.
          command: deploy
